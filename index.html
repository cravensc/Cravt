<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciera Cravens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  :root {
    --purple:    #4E2A84;
    --purple-dk: #1F0E3D;
    --gold:      #B4975A;
    --cream:     #F5F0E8;
    --line:      rgba(78,42,132,.1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    background:
      radial-gradient(circle at top left, rgba(78,42,132,.12), transparent 30rem),
      linear-gradient(180deg, #f9f5ee 0%, var(--cream) 100%);
    color: var(--purple-dk);
    font-family: 'DM Sans', system-ui, sans-serif;
  }
  main {
    width: min(680px, 100%);
    padding: 3rem;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.7);
    box-shadow: 0 18px 50px rgba(31,14,61,.07);
    backdrop-filter: blur(6px);
  }
  .eyebrow {
    margin: 0 0 1rem;
    font-size: .72rem;
    font-weight: 500;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--gold);
  }
  h1 {
    margin: 0 0 .85rem;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(2.6rem, 7vw, 4.8rem);
    font-weight: 700;
    line-height: .95;
    color: var(--purple);
  }
  p {
    margin: 0;
    max-width: 36rem;
    font-size: 1rem;
    line-height: 1.85;
    color: rgba(31,14,61,.55);
  }
  .actions {
    margin-top: 2.2rem;
    display: flex;
    flex-wrap: wrap;
    gap: .9rem;
    align-items: center;
  }
  a { color: inherit; text-decoration: none; }
  .button {
    padding: .9rem 1.4rem;
    background: var(--purple);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: .8rem;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    border: 1px solid var(--purple);
    transition: background .2s, transform .18s, box-shadow .18s;
  }
  .button:hover {
    background: var(--purple-dk);
    border-color: var(--purple-dk);
    transform: translateY(-1px);
    box-shadow: 0 10px 24px rgba(31,14,61,.14);
  }
  .text-link {
    font-size: .88rem;
    color: var(--gold);
    text-decoration: underline;
    text-decoration-color: rgba(180,151,90,.4);
    text-underline-offset: 3px;
    transition: text-decoration-color .2s;
  }
  .text-link:hover { text-decoration-color: var(--gold); }
  @media (max-width: 640px) {
    main { padding: 2rem 1.5rem; }
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Ciera Cravens</p>
    <h1>Under Construction</h1>
    <p>
      A personal site is in progress. In the meantime — she just graduated from Northwestern University. Head to the announcement below.
    </p>
    <div class="actions">
      <a class="button" href="/graduation.html">View Graduation Announcement</a>
      <a class="text-link" href="/craft/algorithmic-ethnography.html">Algorithmic Ethnography</a>
      <a class="text-link" href="mailto:cieracravenz@gmail.com">cieracravenz@gmail.com</a>
    </div>
  </main>
</body>
</html>
