<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciera Cravens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f1e8;
    --ink:#1f1a17;
    --rust:#9f4c2d;
    --stone:#74685f;
    --line:rgba(31,26,23,.14);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:2rem;
    background:
      radial-gradient(circle at top left, rgba(159,76,45,.16), transparent 28rem),
      linear-gradient(180deg, #fbf7f0 0%, var(--paper) 100%);
    color:var(--ink);
    font-family:"Manrope",system-ui,sans-serif;
  }
  main{
    width:min(680px,100%);
    padding:3rem;
    border:1px solid var(--line);
    background:rgba(255,255,255,.64);
    box-shadow:0 18px 50px rgba(45,29,20,.08);
    backdrop-filter:blur(6px);
  }
  .eyebrow{
    margin:0 0 1rem;
    font-size:.78rem;
    font-weight:700;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--rust);
  }
  h1{
    margin:0 0 .75rem;
    font-family:"Fraunces",Georgia,serif;
    font-size:clamp(2.4rem,7vw,4.8rem);
    line-height:.95;
  }
  p{
    margin:0;
    max-width:36rem;
    font-size:1.05rem;
    line-height:1.8;
    color:var(--stone);
  }
  .actions{
    margin-top:2rem;
    display:flex;
    flex-wrap:wrap;
    gap:.9rem;
  }
  a{
    color:inherit;
    text-decoration:none;
  }
  .button{
    padding:.95rem 1.25rem;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    font-weight:700;
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .button:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 24px rgba(31,26,23,.12);
    background:#312925;
  }
  .text-link{
    align-self:center;
    color:var(--rust);
    text-decoration:underline;
    text-underline-offset:3px;
  }
  @media (max-width:640px){
    main{padding:2rem 1.5rem}
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Ciera Cravens</p>
    <h1>Under Construction</h1>
    <p>
      A personal site is in progress. In the meantime, if you are from Corkins, my Topology Experience Coordinator application is available below.
    </p>
    <div class="actions">
      <a class="button" href="/topology/">View Topology Application</a>
      <a class="text-link" href="mailto:cieracravenz@gmail.com">cieracravenz@gmail.com</a>
    </div>
  </main>
</body>
</html>
